{% load django_browser_reload %}
{% load static %}

<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GitHub Codespaces ♥️ Django">
    <meta name="author" content="GitHub Codespaces">
    <meta name="generator" content="GitHub Codespaces">
    <meta name="theme-color" content="#000000">
    <title>{% block title %}Cadastro | Webknowledge{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'cadastro.css' %}">
</head>

<body>

    <div class="background-pattern"></div>

    <div class="login-container">
        <div class="brand-logo">
            Webknowledge <span><img src="{% static 'icone2.png' %}" alt="Ícone Webknowledge" width="40"></span>
        </div>

        <div class="login-box">
            <h2>Cadastro</h2>
            <form method="post" aria-labelledby="form-title">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="id_username" class="form-label">Username:</label>
                    {{ form.username }}
                </div>
                
                <div class="form-group">
                    <label for="id_password" class="form-label">Password:</label>
                    {{ form.password }}
                </div>

                {{ form2 }}
                
                <button type="submit" aria-label="Cadastrar conta">Cadastrar</button>
            </form>

            <p><a href="/" aria-label="Ir para login">Já tem uma conta? Entre aqui.</a></p>
        </div>
    </div>

    <div class="icons">
        <a href="/sobrenos/" aria-label="Saiba mais sobre nós">Sobre nós</a>
    </div>

</body>
</html>
