{% load django_browser_reload %}
{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Login - WebKnowledge</title>
    
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>

<body style="background: url('{% static 'pattern2.jpeg' %}') no-repeat center center/cover; background-color: #1e1e1e;">

    <div class="container">
        <div class="logo">
            <h1>WebKnowledge <a href="sobrenos/" class="button-link">Sobre Nós</a></h1>
        </div>
        
        <div class="login-box">
            <h2>Login</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Usuário</label>
                    <input type="text" id="id_username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="id_password">Senha</label>
                    <input type="password" id="id_password" name="password" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
            <a href="cadastro/" class="button-link">Criar Conta</a>
        </div>
    </div>
</body>

</html>
