{% load django_browser_reload %}
{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>LoginWebknowledge</title>
    
    <link rel="stylesheet" href="{% static 'main.css' %}">
</head>

<body>
    <div class="sobrenos">
        <a href="{% url 'sobrenos' %}">Sobre Nós</a>
    </div>

    <div class="container">
        <div class="logo">
            <h1>Webknowledge</h1>
            <img src="{% static 'icone2.png' %}" alt="Logo">
        </div>

        <div class="login-box">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    {{ formulario.username.label_tag }} 
                    {{ formulario.username }}
                </div>
                <div class="form-group">
                    {{ formulario.password.label_tag }}
                    {{ formulario.password }}
                </div>
                <button type="submit">Entrar</button>
            </form>

            <a href="{% url 'cadastro' %}">Ainda não tem uma conta?</a>
        </div>
    </div>
</body>

</html>
